name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches mod_version
        run: |
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=${GITHUB_REF_NAME}  mod_version=${MOD_VERSION}"
          if [ "${MOD_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 gradle.properties 的 mod_version=${MOD_VERSION} 不一致"
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          body: |
            Minecraft **1.20.1** ｜ Forge **47.x** ｜ Java **17**

            下载下方的 `flysword-*.jar` 放入 `.minecraft/mods` 即可，客户端与服务端都需要安装。

            完整说明见 [README](https://github.com/${{ github.repository }}#readme)。