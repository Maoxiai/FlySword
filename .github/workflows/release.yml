name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches mod_version
        run: |
          MOD_VERSION=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "tag=${GITHUB_REF_NAME}  mod_version=${MOD_VERSION}"
          if [ "${MOD_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 gradle.properties 的 mod_version=${MOD_VERSION} 不一致"
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          body: |
            Minecraft **1.20.1** ｜ Forge **47.x** ｜ Java **17**

            ### 安装

            下载下方的 `flysword-*.jar` 放入 `.minecraft/mods`，客户端与服务端都需要安装。

            ### 附魔

            - **御剑飞行**：手持附魔剑右键召唤飞剑并骑乘。空格上升、左 Ctrl 下降、WASD 移动、左 Shift 收剑；持剑受击时附带剑罡护体减伤
            - **剑气**：左键点击空气发射剑气，命中后伤害递减，满级可穿透多个目标
            - **剑意通明**：持剑时提升攻击伤害，与锋利同曲线且可叠加

            ### 剑招（由境界等级解锁）

            | 招式 | 默认按键 | 境界门槛 |
            | --- | --- | --- |
            | 剑气纵横 | `V` | 1 级 |
            | 御剑术 | 潜行 + `V` | 3 级 |
            | 万剑归宗 | `B` | 4 级 |
            | 剑雨 | 潜行 + `B` | 5 级 |

            四个招式的冷却各自独立计时，境界不足或冷却中会在动作栏提示。

            三个附魔均为 5 级，飞行拖尾与护体粒子随等级递进（炼气 / 筑基 / 金丹 / 元婴 / 化神）。
            平衡参数可在 `config/flysword-common.toml` 中调整，无需重新编译。

            详细说明见 [README](https://github.com/${{ github.repository }}#readme)。